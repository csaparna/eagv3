[project]
name = "agentswitch-forms"
version = "0.1.0"
description = "AgentSwitch Forms Seat (Seat 25) Testing Framework and Test Setup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "jsonschema>=4.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
